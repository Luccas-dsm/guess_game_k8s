upstream backend {
    server backend-service:5000;
}

server {
    listen 3001;
    
    # Health check
    location /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
    }
    
    # API do backend
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        # Rewrite /api/create para /create
        rewrite ^/api/(.*) /$1 break;
    }
    
    # Frontend React
    location / {
        proxy_pass http://frontend-service:3000;
        proxy_set_header Host $host;
    }
}
