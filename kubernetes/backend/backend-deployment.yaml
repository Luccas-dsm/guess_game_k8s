apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: guess-game
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: luccasdsm/guess-game-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_APP
              valueFrom:
                configMapKeyRef:
                  name: guess-game-config
                  key: FLASK_APP
            - name: FLASK_DB_TYPE
              valueFrom:
                configMapKeyRef:
                  name: guess-game-config
                  key: FLASK_DB_TYPE
            - name: FLASK_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: guess-game-config
                  key: POSTGRES_USER
            - name: FLASK_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: guess-game-config
                  key: POSTGRES_DB
            - name: FLASK_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: guess-game-config
                  key: POSTGRES_HOST
            - name: FLASK_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: guess-game-config
                  key: POSTGRES_PORT
            - name: FLASK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guess-game-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
