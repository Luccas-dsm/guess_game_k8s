{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backend
    {{- include "guess-game.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: {{ include "guess-game.image" (dict "Values" .Values "repository" .Values.backend.image.repository "tag" .Values.backend.image.tag) }}
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.backend.service.port }}
        env:
        - name: FLASK_APP
          value: "run.py"
        - name: FLASK_DB_TYPE
          value: "postgres"
        - name: FLASK_DB_USER
          value: {{ .Values.postgresql.username }}
        - name: FLASK_DB_NAME
          value: {{ .Values.postgresql.database }}
        - name: FLASK_DB_HOST
          value: "postgres-service"
        - name: FLASK_DB_PORT
          value: "5432"
        - name: FLASK_DB_PASSWORD
          value: {{ .Values.postgresql.password }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.backend.service.port }}
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.backend.service.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
{{- end }}